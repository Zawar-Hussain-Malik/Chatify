name: chatify_final_project
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.1

  # State management & utilities
  get: ^4.6.6
  get_storage: ^2.1.1
  uuid: ^4.5.1
  intl: ^0.20.2

  # Firebase (UPDATED)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # Media & files
  image_picker: ^1.2.1
  file_picker: ^10.3.7
